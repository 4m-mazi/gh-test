name: exp-B reusable
on: workflow_call
permissions: {}
env:
  SLEEP_SECONDS: '300'
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ctx
        run: |
          echo "event=$GITHUB_EVENT_NAME workflow=$GITHUB_WORKFLOW run_id=$GITHUB_RUN_ID job=$GITHUB_JOB"
          date -Is
      - run: sleep "$SLEEP_SECONDS"
      - name: done
        run: date -Is
